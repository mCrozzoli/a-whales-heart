# Publishes site/ to GitHub Pages on every push to main, after the publish
# gates pass (tools/check_site.py). Modelled on calum-organ's pages.yml.
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".
name: Check and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_site.py site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers cache each file for 10 minutes: stamp references with this
      # commit so nobody gets a mix of old and new files after a deploy.
      - run: python3 tools/version_assets.py site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
